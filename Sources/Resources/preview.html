<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- CSP allows 'unsafe-inline' for styles because Mermaid.js injects
         inline styles during diagram rendering. This is required for proper rendering. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; frame-ancestors 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="preview.css">
    <script src="mermaid.min.js" defer></script>
    <script src="preview.js" defer></script>
</head>
<body>
    <div id="diagram"></div>
</body>
</html>
